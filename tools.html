<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

</head>
<body>

<div class="bg-layer">
  <div class="grid"></div>
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<nav>
  <div class="w">
    <a href="index.html" class="logo">🏗️ <span class="hl">灵境建站</span></a>
    <button class="menu-btn" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
    <div class="nav-links">
      <a href="index.html">🏠 首页</a>
      <a href="services.html">💼 建站服务</a>
      <a href="pricing.html">💎 报价</a>

      <a href="tools.html">🔧 在线工具</a>
      <a href="contact.html" class="nav-cta">立即咨询</a>
    </div>
  </div>
</nav>

<div class="page-header">
  <div class="w">
    <span class="section-tag">🔧 在线工具</span>
    <h1 class="page-title">免费 AI 工具箱</h1>
    <p class="page-sub">建站客户免费使用。AI 生图、AI 文案，帮你快速完成内容创作。</p>
  </div>
</div>

<section class="sec" style="padding-top:0;">
  <div class="w">

    <!-- 生图工具 -->
    <div class="tool-section" style="margin-bottom:40px;" id="sheng-tu">
      <h3 style="display:flex;align-items:center;gap:8px;font-size:1.15rem;margin-bottom:16px;">
        🎨 AI 生图 <span style="border-radius:20px;padding:2px 10px;font-size:.7rem;font-weight:500;background:rgba(52,211,153,.12);color:var(--green);">免费</span>
      </h3>
      <div class="card">
        <div class="gen-area">
          <div>
            <div class="gen-box">
              <label for="prompt">✏️ 描述你想要的画面</label>
              <textarea id="prompt" placeholder="例如：一只可爱的柴犬在樱花树下，日系动漫风格">一只可爱的柴犬在樱花树下，阳光明媚</textarea>
            </div>
            <div style="margin-top:14px;">
              <label style="display:block;font-size:.88rem;font-weight:500;margin-bottom:6px;">🎭 选择风格</label>
              <div class="style-options" id="styleOptions">
                <button data-style="" class="active">🔄 无指定</button>
                <button data-style="写实,摄影">📷 写实</button>
                <button data-style="动漫,二次元">🎨 二次元</button>
                <button data-style="水彩画">🎨 水彩</button>
                <button data-style="油画">🖼️ 油画</button>
                <button data-style="赛博朋克,霓虹灯">🌃 赛博朋克</button>
              </div>
            </div>
            <div style="display:flex;gap:12px;margin-top:14px;">
              <select id="genSize" style="padding:10px 14px;background:var(--surf2);border:1px solid var(--bord);border-radius:var(--radius-sm);color:var(--txt);font-size:.88rem;outline:none;flex:1;">
                <option value="1024">1024×1024 方形</option>
                <option value="1024x768">1024×768 横屏</option>
                <option value="768x1024">768×1024 竖屏</option>
              </select>
              <button id="genBtn" class="btn btn-primary" onclick="generateImage()">✨ 生成图片</button>
            </div>
            <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
              <button class="btn btn-sm btn-outline" onclick="fillPrompt('一只穿着宇航服的猫在月球上奔跑，背景是蓝色的地球')">🚀 太空猫</button>
              <button class="btn btn-sm btn-outline" onclick="fillPrompt('夕阳下的海边，紫色晚霞，海浪拍打礁石')">🌅 夕阳海</button>
              <button class="btn btn-sm btn-outline" onclick="fillPrompt('赛博朋克未来城市，霓虹灯雨夜，细节丰富')">🌃 赛博城</button>
            </div>
          </div>
          <div>
            <div class="gen-result" id="genResult">
              <div class="placeholder">
                <span class="big-ico">🎨</span>
                <span>输入描述，点击生成<br/>AI 为你绘制图片</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 文案工具 -->
    <div class="tool-section" id="wen-an">
      <h3 style="display:flex;align-items:center;gap:8px;font-size:1.15rem;margin-bottom:16px;">
        ✍️ AI 文案 <span style="border-radius:20px;padding:2px 10px;font-size:.7rem;font-weight:500;background:rgba(52,211,153,.12);color:var(--green);">免费</span>
      </h3>
      <div class="card">
        <div class="gen-area">
          <div>
            <div class="gen-box">
              <label for="wenAnInput">✏️ 输入文案主题或要求</label>
              <textarea id="wenAnInput" placeholder="例如：帮我写一段小红书的旅游攻略文案，目的地是云南大理">帮我写一段小红书的旅游攻略文案，目的地是云南大理</textarea>
            </div>
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
              <button class="btn btn-sm btn-outline" onclick="fillAn('帮我写一个产品介绍文案，产品是AI在线生图工具')">📦 产品介绍</button>
              <button class="btn btn-sm btn-outline" onclick="fillAn('帮我写一篇SEO文章，主题是「如何用AI建网站」')">📝 SEO文章</button>
              <button class="btn btn-sm btn-outline" onclick="fillAn('帮我写一段小程序推广文案，目标用户是不懂代码的人')">📢 推广文案</button>
            </div>
            <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="generateWenAn()">✍️ 生成文案</button>
          </div>
          <div>
            <label style="display:block;font-size:.88rem;font-weight:500;margin-bottom:6px;">📄 生成结果（可复制）</label>
            <div id="wenAnResult" style="background:var(--surf2);border:1px solid var(--bord);border-radius:var(--radius-sm);padding:16px;min-height:160px;font-size:.88rem;color:var(--muted);line-height:1.8;white-space:pre-wrap;user-select:text;" onclick="selectText(this)">输入主题后点击"生成文案"</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>

<footer>
  <div class="w">
    <div class="fl">
      <a href="index.html">首页</a>
      <a href="services.html">建站服务</a>
      <a href="pricing.html">报价</a>
      <a href="tutorial.html">OpenClaw教程</a>
      <a href="tools.html">在线工具</a>
      <a href="contact.html">联系我</a>
    </div>
    <p>© 2026 灵境建站 · 免费在线 AI 工具</p>
  </div>
</footer>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
